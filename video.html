<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Tutorials | KAMRAN-MD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  
  <style>
    :root { --primary: #ff9900; --secondary: #ff5500; --bg-color: #ffffff; --text-color: #1a1a1a; --subtext-color: #666666; --border-color: rgba(0,0,0,0.08); --box-bg: #f9f9fb; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 40px auto; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--box-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 13px; }
    .back-btn:hover { background: var(--primary); color: white; }
    
    .admin-icon-btn { background: rgba(255,153,0, 0.15); border: 1px solid var(--primary); color: var(--primary); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: 0.3s; }
    .admin-icon-btn:hover { background: var(--primary); color: white; }

    h1 { color: var(--primary); font-size: 28px; margin-bottom: 8px; }
    p.desc { font-size: 13px; color: var(--subtext-color); margin-bottom: 25px; }

    .video-card { background: var(--box-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .video-card h3 { font-size: 16px; margin-bottom: 12px; color: var(--text-color); }
    .video-responsive { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; }
    .video-responsive iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    /* Admin Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 15px; }
    .modal-overlay.show { display: flex; }
    .modal-card { background: #fff; border-radius: 20px; width: 100%; max-width: 450px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); color: #1a1a1a; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; font-size: 13px; margin-top: 5px; outline: none; }
    .form-input:focus { border-color: var(--primary); }
    .modal-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 5px; }
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
      <button class="admin-icon-btn" onclick="openAdminModal()" title="Admin Login"><i class="fas fa-user-shield"></i></button>
    </div>

    <h1>Video Tutorials</h1>
    <p class="desc">Watch step-by-step guides on how to connect and deploy your WhatsApp bot easily.</p>
    
    <!-- Videos yahan live load honge -->
    <div id="videosContainer"></div>
  </div>

  <!-- Admin Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle" style="color:var(--primary);">Admin Portal</h3>
        <button onclick="closeAdminModal()" style="background:none; border:none; font-size:18px; cursor:pointer;">&times;</button>
      </div>

      <div id="loginSection">
        <div class="form-group">
          <label>Enter Admin Password</label>
          <input type="password" id="adminPassInput" class="form-input" placeholder="Password (admin)">
        </div>
        <button class="modal-btn" onclick="verifyAdmin()">Login</button>
      </div>

      <div id="dashboardSection" class="admin-panel">
        <p style="font-size:12px; color:green; margin-bottom:10px;"><i class="fas fa-check-circle"></i> Logged in as Dr. Kamran</p>
        <div class="form-group">
          <label>Video Title</label>
          <input type="text" id="videoTitle" class="form-input" placeholder="e.g. How to connect bot">
        </div>
        <div class="form-group">
          <label>YouTube Embed / Video URL</label>
          <input type="text" id="videoUrl" class="form-input" placeholder="https://www.youtube.com/watch?v=...">
        </div>
        <button class="modal-btn" onclick="publishVideo()">Upload Video to DB</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAPni9nn_4ITReeTpmRkDPnldZQviLUHVU",
      authDomain: "digitalstoneofficial-21cc2.firebaseapp.com",
      databaseURL: "https://digitalstoneofficial-21cc2-default-rtdb.firebaseio.com",
      projectId: "digitalstoneofficial-21cc2",
      storageBucket: "digitalstoneofficial-21cc2.appspot.com",
      messagingSenderId: "568364264149",
      appId: "1:568364264149:web:e00ed44d99aca285ed905c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function openAdminModal() { document.getElementById('adminModal').classList.add('show'); }
    function closeAdminModal() { document.getElementById('adminModal').classList.remove('show'); }

    function verifyAdmin() {
      if (document.getElementById('adminPassInput').value === 'kamran@7860#') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').classList.add('active');
        document.getElementById('modalTitle').textContent = 'Admin Dashboard';
      } else { alert('Incorrect Password!'); }
    }

    // Advanced YouTube URL Converter (Handles m.youtube.com, youtu.be, shorts, etc.)
    function getYoutubeEmbedUrl(url) {
      if (!url) return '';
      let videoId = "";
      
      // RegEx pattern to extract YouTube Video ID from any URL format
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
      const match = url.match(regExp);

      if (match && match[2].length === 11) {
        videoId = match[2];
        return `https://www.youtube.com/embed/${videoId}`;
      }
      return url;
    }

    function publishVideo() {
      const title = document.getElementById('videoTitle').value.trim();
      let rawUrl = document.getElementById('videoUrl').value.trim();

      if (!title || !rawUrl) { alert('Please fill in all fields!'); return; }

      const embedUrl = getYoutubeEmbedUrl(rawUrl);

      db.ref('admin_videos').push({ title, url: embedUrl, timestamp: Date.now() }, (error) => {
        if (!error) {
          alert('Video uploaded successfully!');
          closeAdminModal();
          document.getElementById('videoTitle').value = '';
          document.getElementById('videoUrl').value = '';
        } else {
          alert('Failed to upload video.');
        }
      });
    }

    // Load Videos live from Firebase Database & Auto-fix old URLs on display
    db.ref('admin_videos').on('value', (snapshot) => {
      const container = document.getElementById('videosContainer');
      container.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.values(data).reverse().forEach(video => {
          // Display karne se pehle bhi URL ko auto-fix kiya ja raha hai
          const cleanUrl = getYoutubeEmbedUrl(video.url);

          container.innerHTML += `
            <div class="video-card">
              <h3><i class="fas fa-video" style="color:var(--primary); margin-right:8px;"></i>${video.title}</h3>
              <div class="video-responsive">
                <iframe src="${cleanUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
              </div>
            </div>
          `;
        });
      } else {
        container.innerHTML = `<p style="text-align:center; color:var(--subtext-color);">No videos uploaded yet. Use the admin icon above to add tutorials.</p>`;
      }
    });
  </script>
</body>
</html>
